<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F52FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#13B9FD" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13B9FD" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7F52FF" stop-opacity="0.6" />
    </linearGradient>
  </defs>
  <!-- Background glow grid -->
  <rect x="20" y="20" width="360" height="260" rx="16" fill="url(#grad1)" fill-opacity="0.05" stroke="url(#grad1)" stroke-width="1.5" stroke-dasharray="6 6" />
  <!-- Central Architecture Nodes -->
  <rect x="50" y="60" width="120" height="70" rx="12" fill="#12151C" stroke="url(#grad1)" stroke-width="2" />
  <text x="110" y="100" fill="#EDEEF0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Native Core</text>

  <rect x="230" y="60" width="120" height="70" rx="12" fill="#12151C" stroke="url(#grad2)" stroke-width="2" />
  <text x="290" y="100" fill="#EDEEF0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Flutter Engine</text>

  <rect x="140" y="180" width="120" height="70" rx="12" fill="#12151C" stroke="url(#grad1)" stroke-width="2" />
  <text x="200" y="220" fill="#13B9FD" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Clean Architecture</text>

  <!-- Connectors -->
  <path d="M110 130 L170 180" stroke="#7F52FF" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M290 130 L230 180" stroke="#13B9FD" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="140" cy="155" r="4" fill="#7F52FF" />
  <circle cx="260" cy="155" r="4" fill="#13B9FD" />
</svg>